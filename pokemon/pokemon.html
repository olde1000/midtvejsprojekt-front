<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex - Pokémon</title>
    <link rel="stylesheet" href="pokemon.css">
</head>
<body>

<nav>
    <a href="../dashboard/dashboard.html">Dashboard</a>
    <a href="../pokemon/pokemon.html">Pokémon</a>
    <a href="../trainers/trainers.html">Trainers</a>
    <a href="../battle/battle.html">Battle</a>
</nav>

<main>
    <h1>Pokémon</h1>

    <div class="pokemon-search">
        <input
                type="text"
                id="pokemonSearch"
                placeholder="Search by Pokémon name..."
        />

        <select id="pokemonType">
            <option value="">All types</option>
            <option value="Normal">Normal</option>
            <option value="Fire">Fire</option>
            <option value="Water">Water</option>
            <option value="Electric">Electric</option>
            <option value="Grass">Grass</option>
            <option value="Ice">Ice</option>
            <option value="Fighting">Fighting</option>
            <option value="Poison">Poison</option>
            <option value="Ground">Ground</option>
            <option value="Flying">Flying</option>
            <option value="Psychic">Psychic</option>
            <option value="Bug">Bug</option>
            <option value="Rock">Rock</option>
            <option value="Ghost">Ghost</option>
            <option value="Dragon">Dragon</option>
            <option value="Dark">Dark</option>
            <option value="Steel">Steel</option>
            <option value="Fairy">Fairy</option>
        </select>

        <select id="pokemonEvolution">
            <option value="">All evolution stages</option>
            <option value="1">Stage 1</option>
            <option value="2">Stage 2</option>
            <option value="3">Stage 3</option>
            <option value="null">No evolution stage</option>
        </select>


        <button onclick="searchPokemon()">Search</button>
    </div>

    <div id="searchResults" class="pokemon-grid"></div>
</main>

<script src="pokemon.js"></script>
</body>
</html>
